<section class="visible-md visible-lg">
  <h5><a href="{{'/about/' | prepend: site.baseurl }}">{{ site.data.ui-text[site.ui_lang].about_community }}</a></h5>
  <div class="short-about">
    {% if site.sidebar-avatar %}
    <img src="{{site.sidebar-avatar}}" alt="刺桐说社群头像" loading="lazy" />
    {% endif %}
    {% if site.sidebar-about-description %}
    <p>{{site.sidebar-about-description}}</p>
    {% endif %}
  </div>
</section>
